name: Publish benchmark report
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Include root verification file in Pages artifact
        run: cp myslop.txt qwen3.8-flash-next_rtx3090_RAM96GB/myslop.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: qwen3.8-flash-next_rtx3090_RAM96GB
      - uses: actions/deploy-pages@v4
        id: deployment
